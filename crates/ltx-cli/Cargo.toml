[package]
name = "ltx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the LTX alpha matte pipeline."

[[bin]]
name = "ltx"
path = "src/main.rs"

[features]
default = []
metal = ["ltx-burn/metal", "burn/metal"]
cuda = ["ltx-burn/cuda", "burn/cuda"]

[dependencies]
anyhow.workspace = true
burn.workspace = true
clap = { workspace = true, features = ["env"] }
half.workspace = true
ltx-backend = { path = "../ltx-backend" }
ltx-burn = { path = "../ltx-burn", default-features = false }
ltx-pipeline = { path = "../ltx-pipeline" }

[lints]
workspace = true
