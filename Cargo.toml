[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "UNLICENSED"
repository = "https://github.com/Invenio-Media/ltx-rust"

# Every third-party dependency is declared here once. Crates use `dep.workspace = true`.
[workspace.dependencies]
anyhow = "1"
burn = { version = "0.21", default-features = false }
bytemuck = "1"
clap = { version = "4", features = ["derive"] }
exr = "1"
half = { version = "2", features = ["bytemuck"] }
memmap2 = "0.9"
nvml-wrapper = "0.13"
safetensors = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
rand = { version = "0.8", features = ["std"] }
rand_distr = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
