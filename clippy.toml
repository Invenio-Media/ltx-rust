allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true

# Burn tensor operators run on the device and cannot overflow a Rust integer.
# `arithmetic_side_effects` (aimed at integer overflow) must not fire on them.
# The def path clippy resolves is `burn_tensor::tensor::api::base::Tensor`;
# `"burn_tensor"` as a contains-check covers all burn tensor arithmetic.
# `f32`/`f64` arithmetic maps to hardware FP and never panics (produces NaN/Inf),
# so those are exempt as well.
arithmetic-side-effects-allowed = ["burn_tensor", "f32", "f64"]
arithmetic-side-effects-allowed-binary = [
    ["burn_tensor", "*"],
    ["*", "burn_tensor"],
    ["f32", "*"],
    ["*", "f32"],
    ["f64", "*"],
    ["*", "f64"],
]
